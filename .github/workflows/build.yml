name: Build Barrel Siege

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - run: |
          curl -fsSL -o forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.2/forge-26.2-65.1.2-mdk.zip
          unzip -q forge-mdk.zip -d forge-mdk
          cp forge-mdk/gradlew .
          cp -R forge-mdk/gradle .
          chmod +x gradlew

      - run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Barrel-Siege-Forge-26.2
          path: build/libs/barrel-siege-1.0.0.jar
