name: Build Barrel Siege

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Fetch the official Forge wrapper
        run: |
          curl -fsSL -o forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.2/forge-26.2-65.1.2-mdk.zip
          unzip -q forge-mdk.zip -d forge-mdk
          cp forge-mdk/gradlew .
          cp -R forge-mdk/gradle .
          chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload ready mod
        uses: actions/upload-artifact@v4
        with:
          name: Barrel-Siege-Forge-26.2
          path: build/libs/barrel-siege-1.0.0.jar
          if-no-files-found: error
